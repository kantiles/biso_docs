name: Publication HTML

# Assemble les md, y insère libellés, codes ISD, panorama, sources et années
# (équivalent de R/insertion_lignes.R) et publie le résultat sous forme d'une
# page html unique au format DSFR.
#
# Secrets à définir (Settings > Secrets and variables > Actions) :
#   KEY_GRIST              clé d'API Grist (R/assemblage_documentation.R)
#   SCW_KEY_ID             identifiants d'accès au S3 Scaleway
#   SCW_ACCESS_KEY

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Image avec R, le tidyverse, pandoc, sf (requis par gristapi) et arrow (S3)
    container: rocker/geospatial:latest
    env:
      # Données BISO sur le S3 : s3://biso/data/indicateurs_biso_<source>.parquet
      S3_ENDPOINT: s3.fr-par.scw.cloud
      S3_SOURCES: finess as rp autre
      BISO_DATA_DIR: donnees_biso
    steps:
      - uses: actions/checkout@v4

      - name: Installation de gristapi
        run: |
          Rscript -e 'install.packages("remotes")' \
            -e 'remotes::install_github("spyrales/gristapi", upgrade = "never")'

      - name: Récupération des données BISO sur le S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
        shell: Rscript {0}
        run: |
          dossier <- Sys.getenv("BISO_DATA_DIR")
          dir.create(dossier, showWarnings = FALSE)
          bucket <- arrow::s3_bucket(
            "biso",
            endpoint_override = Sys.getenv("S3_ENDPOINT"),
            region = "fr-par"
          )
          for (source in strsplit(Sys.getenv("S3_SOURCES"), " ")[[1]]) {
            fichier <- paste0("indicateurs_biso_", source, ".parquet")
            arrow::read_parquet(
              bucket$path(paste0("data/", fichier)),
              as_data_frame = FALSE
            ) |>
              arrow::write_parquet(file.path(dossier, fichier))
          }
          print(file.info(list.files(dossier, full.names = TRUE))["size"])

      - name: Assemblage et enrichissement de la documentation
        env:
          KEY_GRIST: ${{ secrets.KEY_GRIST }}
        run: Rscript R/export_html.R

      - name: Conversion Markdown -> HTML (DSFR)
        run: .github/pandoc/build.sh documentation_biso.md _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
