name: Documentation HTML complète

# Équivalent de R/insertion_lignes.R, avec une page html unique au format DSFR
# en sortie au lieu du pdf.
#
# Secrets à définir (Settings > Secrets and variables > Actions) :
#   KEY_GRIST              clé d'API Grist (R/import_documentation.R)
#   SCW_KEY_ID             identifiants d'accès au S3 Scaleway
#   SCW_ACCESS_KEY

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    env:
      # Données BISO sur le S3 : s3://biso/data/indicateurs_biso_<source>.parquet
      S3_ENDPOINT: https://s3.fr-par.scw.cloud
      S3_PREFIXE: s3://biso/data/indicateurs_biso_
      S3_SOURCES: finess as rp autre
      AWS_DEFAULT_REGION: fr-par
      BISO_DATA_DIR: donnees_biso
    steps:
      - uses: actions/checkout@v4

      - name: Récupération des données BISO sur le S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
        run: |
          mkdir -p "$BISO_DATA_DIR"
          for source in $S3_SOURCES; do
            aws s3 cp --endpoint-url "$S3_ENDPOINT" \
              "${S3_PREFIXE}${source}.parquet" "$BISO_DATA_DIR/"
          done
          ls -l "$BISO_DATA_DIR"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::stringr
            any::readr
            any::purrr
            any::httr2
            any::arrow

      - name: Assemblage et enrichissement de la documentation
        env:
          KEY_GRIST: ${{ secrets.KEY_GRIST }}
        run: Rscript R/export_html.R

      - name: Installation de Pandoc
        uses: pandoc/actions/setup@v1

      - name: Conversion Markdown -> HTML (DSFR)
        run: .github/pandoc/build_unique.sh documentation_biso.md documentation_biso.html

      - uses: actions/upload-artifact@v4
        with:
          name: documentation-biso
          path: documentation_biso.html
