<!doctype html>
<html lang="fr" data-fr-scheme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="format-detection" content="telephone=no,date=no,address=no,email=no,url=no">
  <meta name="theme-color" content="#000091">
  <title>$title$ — BISO</title>
  <link rel="stylesheet" href="dsfr/dsfr.min.css">
    <link rel="apple-touch-icon" href="dsfr/favicon/apple-touch-icon.png">
  <link rel="icon" href="dsfr/favicon/favicon.svg" type="image/svg+xml">
  <link rel="shortcut icon" href="dsfr/favicon/favicon.ico" type="image/x-icon">
  <link rel="manifest" href="dsfr/favicon/manifest.webmanifest" crossorigin="use-credentials">
  <style>
    .biso-content h1 { margin: 3rem 0 2rem; scroll-margin-top: 1rem; }
    .biso-content h2 { margin-top: 2.5rem; scroll-margin-top: 1rem; }
    .biso-content hr { margin: 2rem 0; }
  </style>
</head>
<body>
  <div class="fr-skiplinks">
    <nav class="fr-container" role="navigation" aria-label="Accès rapide">
      <ul class="fr-skiplinks__list">
        <li><a class="fr-link" href="#contenu">Contenu</a></li>
        <li><a class="fr-link" href="#menu">Menu</a></li>
        <li><a class="fr-link" href="#footer">Pied de page</a></li>
      </ul>
    </nav>
  </div>

${ entete() }

  <div class="fr-container fr-my-6w">
    <div class="fr-grid-row fr-grid-row--gutters">
      <div class="fr-col-12 fr-col-md-4">
        <nav class="fr-sidemenu fr-sidemenu--sticky-full-height" role="navigation" aria-labelledby="menu-title" id="menu">
          <div class="fr-sidemenu__inner">
            <button class="fr-sidemenu__btn" aria-controls="menu-collapse" aria-expanded="false">Dans cette documentation</button>
            <div class="fr-collapse" id="menu-collapse">
              <p class="fr-sidemenu__title" id="menu-title">$title$</p>
              <ul class="fr-sidemenu__list">
$for(chapitres)$
                <li class="fr-sidemenu__item">
                  <button class="fr-sidemenu__btn" aria-expanded="false" aria-controls="menu-$chapitres.num$">$chapitres.title$</button>
                  <div class="fr-collapse" id="menu-$chapitres.num$">
                    <ul class="fr-sidemenu__list">
                      <li class="fr-sidemenu__item"><a class="fr-sidemenu__link" href="#$chapitres.id$">Début du chapitre</a></li>
$for(chapitres.sections)$
                      <li class="fr-sidemenu__item"><a class="fr-sidemenu__link" href="#$chapitres.sections.id$">$chapitres.sections.title$</a></li>
$endfor$
                    </ul>
                  </div>
                </li>
$endfor$
              </ul>
            </div>
          </div>
        </nav>
      </div>
      <main class="fr-col-12 fr-col-md-8 biso-content" id="contenu" role="main">
        <h1>$title$</h1>
        <p class="fr-text--sm">Générée le $date$</p>
$body$
      </main>
    </div>
  </div>

${ pied() }

  <script type="module" src="dsfr/dsfr.module.min.js"></script>
  <script nomodule src="dsfr/dsfr.nomodule.min.js"></script>
</body>
</html>
